server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permitir subidas grandes de .ama (trafico). Default de nginx: 1m.
    client_max_body_size 4096m;

    # App Vue (SPA con router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cachear el index.html (siempre revalida) para evitar pantallas
    # en blanco tras un deploy que cambia los hashes de los assets
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # API -> backend
    location /api/ {
        proxy_pass http://backend:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Subidas grandes (trafico .ama): no bufferizar y ampliar timeouts.
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_body_timeout 1800s;
    }

    # WebSocket (socket.io) -> backend
    location /socket.io/ {
        proxy_pass http://backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
